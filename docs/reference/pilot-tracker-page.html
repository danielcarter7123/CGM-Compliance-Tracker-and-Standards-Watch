<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NERC Compliance Tracker (Sandbox Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen operator console — sticky header + tab rail, summary strip before detail, tables scroll in their own containers. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eaeef4; --line:#d5dce6; --fg:#16202e; --muted:#5a6779;
  --accent:#1f4fb8; --accent-ink:#ffffff; --accent-soft:#e3ebfb;
  --crit:#b42318; --crit-soft:#fde8e6; --warn:#a15c00; --warn-soft:#fdf0d9; --ok:#1e7a46; --ok-soft:#e1f3e8; --info:#4a5a73; --info-soft:#e9edf3;
  --shadow:0 8px 30px rgba(22,32,46,.16);
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141c; --surface:#161d28; --surface-2:#1e2735; --line:#2c3748; --fg:#e4e9f1; --muted:#97a3b6;
  --accent:#7aa2ff; --accent-ink:#0b1220; --accent-soft:#1d2a47;
  --crit:#ff8a7e; --crit-soft:#3a1c1a; --warn:#f2b45a; --warn-soft:#352812; --ok:#6fd39a; --ok-soft:#14301f; --info:#a9b6ca; --info-soft:#232d3c;
  --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f141c; --surface:#161d28; --surface-2:#1e2735; --line:#2c3748; --fg:#e4e9f1; --muted:#97a3b6;
  --accent:#7aa2ff; --accent-ink:#0b1220; --accent-soft:#1d2a47;
  --crit:#ff8a7e; --crit-soft:#3a1c1a; --warn:#f2b45a; --warn-soft:#352812; --ok:#6fd39a; --ok-soft:#14301f; --info:#a9b6ca; --info-soft:#232d3c;
  --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto;min-width:0}
.brand b{font:700 20px/1.1 var(--f-display);letter-spacing:.01em}
.brand span{color:var(--muted);font-size:12px}
.bell{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;cursor:pointer}
.bell .n{background:var(--crit);color:#fff;border-radius:10px;padding:0 7px;font:600 12px/18px var(--f-mono)}
.bell .n.zero{background:var(--surface-2);color:var(--muted)}
.bell:hover{background:var(--surface-2)}
.bell[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
main{padding-block:20px 60px;display:flex;flex-direction:column;gap:20px}
h2{font:600 18px/1.2 var(--f-display);margin:0;text-wrap:balance}
h3{font:600 15px/1.2 var(--f-display);margin:0;letter-spacing:.01em}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .grow{flex:1 1 220px;min-width:0}
input[type=text],input[type=email],input[type=url],input[type=tel],input[type=date],input[type=number],input[type=url],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:760px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left}
.stat .v{font:600 28px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat.crit .v{color:var(--crit)} .stat.warn .v{color:var(--warn)} .stat.ok .v{color:var(--ok)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h .sp{margin-left:auto}
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover{background:var(--surface-2)}
.item .bar{align-self:stretch;border-radius:3px;background:var(--info-soft)}
.item.overdue .bar{background:var(--crit)} .item.window .bar{background:var(--warn)} .item.done .bar{background:var(--ok)}
.item .t{font-weight:500;overflow-wrap:anywhere}
.item .m{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.when{text-align:right;font-size:12px;white-space:nowrap}
.when b{display:block;font:600 14px var(--f-mono)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.overdue{background:var(--crit-soft);color:var(--crit)}
.pill.window{background:var(--warn-soft);color:var(--warn)}
.pill.nodate{background:var(--warn-soft);color:var(--warn);border:1px dashed var(--warn)}
.pill.scheduled{background:var(--info-soft);color:var(--info)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.inprogress{background:var(--accent-soft);color:var(--accent)}
.pill.reportdue{background:var(--crit-soft);color:var(--crit);border:1px dashed var(--crit)}
.item.review .bar{background:var(--accent)}
.subtabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px;align-self:flex-start;max-width:100%;overflow-x:auto}
.subtabs button{border:0;background:none;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.subtabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 6px;font:500 11px/18px var(--f-mono);color:var(--muted)}
.code{font:500 13px var(--f-mono);color:var(--accent);text-decoration:none;white-space:nowrap}
.code:hover{text-decoration:underline}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--surface-2)}
td.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--fg);font-weight:600}
.note{font-size:12px;color:var(--muted);padding:10px 16px;border-top:1px solid var(--line)}
.month{padding:8px 16px;background:var(--surface-2);font:600 12px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.tpl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:8px 0;border-top:1px dashed var(--line)}
.tpl:first-child{border-top:0}
.std-row td:first-child{width:150px}
.std-detail td{background:var(--surface-2);cursor:default}
.std-detail .inner{display:flex;flex-direction:column;gap:10px;max-width:820px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:50;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:min(560px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.drawer-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.drawer-h h2{margin-right:auto}
.drawer-b{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.drawer-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;position:sticky;bottom:0;background:var(--surface)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lbl{font-size:12px;font-weight:600;color:var(--muted)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:480px){.row2{grid-template-columns:minmax(0,1fr)}}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.checks label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:13px;cursor:pointer;color:var(--fg);font-weight:500}
.checks input{accent-color:var(--accent)}
.callout{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:8px}
.confirm{border:1px solid var(--crit);background:var(--crit-soft);border-radius:6px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px);font-size:13px}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 16px;font-size:13px}
.banner.warn{border-color:var(--warn);background:var(--warn-soft)}
.act-who{display:flex;align-items:center;gap:8px;white-space:nowrap}
.act-who img{width:22px;height:22px;border-radius:50%;flex:none}
.act-chg{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;max-width:420px}
.act-chg b{color:var(--fg);font-weight:600}
.act-chg s{color:var(--muted)}
.tag{display:inline-block;border-radius:4px;padding:0 6px;font:600 11px/18px var(--f-mono);white-space:nowrap}
.tag.created{background:var(--ok-soft);color:var(--ok)} .tag.updated{background:var(--accent-soft);color:var(--accent)}
.tag.completed{background:var(--ok-soft);color:var(--ok)} .tag.deleted{background:var(--crit-soft);color:var(--crit)}
.tag.other{background:var(--info-soft);color:var(--info)}
.av{width:24px;height:24px;border-radius:50%;flex:none;border:2px solid var(--surface)}
.avs{display:flex;align-items:center}.avs .av+.av{margin-left:-8px}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.pp{border:1px solid var(--line);border-radius:6px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface);position:relative}
.pp .pc{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:2px 4px 2px 2px;font-size:13px}
.pp .pc img{width:20px;height:20px;border-radius:50%}
.pp .pc button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 4px;font-size:14px;line-height:1}
.pp input{border:0!important;padding:4px!important;flex:1 1 140px;min-width:120px;background:transparent!important}
.pp input:focus{outline:none}
.pp-menu{position:absolute;left:-1px;right:-1px;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);z-index:5;max-height:260px;overflow:auto}
.pp-menu button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:8px 10px;cursor:pointer;text-align:left}
.pp-menu button:hover,.pp-menu button:focus{background:var(--surface-2)}
.pp-menu img{width:22px;height:22px;border-radius:50%}
.pill.notstarted{background:var(--info-soft);color:var(--info)} .pill.onhold{background:var(--warn-soft);color:var(--warn)} .pill.review{background:var(--accent-soft);color:var(--accent);border:1px dashed var(--accent)}
nav.tabs .n{background:var(--crit);color:#fff;border-radius:10px;padding:0 6px;font:600 11px/17px var(--f-mono);margin-left:4px}
nav.tabs .n.zero{display:none}
.chat{display:grid;grid-template-columns:290px minmax(0,1fr);height:calc(100vh - 230px);min-height:480px;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.chat-list{border-right:1px solid var(--line);overflow-y:auto;min-height:0}
.chat-sec{padding:14px 14px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:flex;align-items:center;justify-content:space-between}
.chat-sec button{border:0;background:none;color:var(--accent);cursor:pointer;font:600 12px var(--f-body);text-transform:none;letter-spacing:0;padding:2px 4px}
.conv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 8px;width:100%;text-align:left;border:0;border-left:3px solid transparent;background:none;padding:7px 14px 7px 11px;cursor:pointer;color:var(--fg)}
.conv:hover{background:var(--surface-2)}
.conv[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.conv .cn{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv.unread .cn{font-weight:700}
.conv .ct{font:11px var(--f-mono);color:var(--muted);align-self:center}
.conv .cl{grid-column:1/-1;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.udot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;margin-left:6px;vertical-align:middle}
.chat-new{padding:4px 14px 8px;display:flex;flex-direction:column;gap:6px}

.chat-new .hits button:hover{background:var(--surface-2)}
.chat-new img{width:22px;height:22px;border-radius:50%}
.chat-note{font-size:11.5px;color:var(--muted);padding:14px;border-top:1px solid var(--line);margin-top:10px}
.chat-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.chat-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chat-h .sp{margin-left:auto}
.chat-back{display:none}
.chat-thread{flex:1;overflow-y:auto;padding:10px 16px 14px;min-height:0}
.daysep{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.daysep::before,.daysep::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;padding:5px 0;position:relative}
.msg.cont{padding-top:0}
.msg.cont .mav,.msg.cont .mh{display:none}
.msg.cont .mbody{grid-column:2}
.mav{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font:600 12px var(--f-body);color:var(--muted);overflow:hidden}
.mav img{width:100%;height:100%;object-fit:cover}
.mh{display:flex;gap:8px;align-items:baseline;font-size:13px}
.mh b{font-weight:600}
.mh span{color:var(--muted);font-size:11px;font-family:var(--f-mono)}
.mt{white-space:pre-wrap;overflow-wrap:anywhere}
.mt.gone{color:var(--muted);font-style:italic}
.mx{position:absolute;right:0;top:4px;border:0;background:var(--surface);color:var(--muted);font-size:12px;cursor:pointer;opacity:0;padding:2px 6px;border-radius:4px}
.msg:hover .mx,.mx:focus{opacity:1}
@media (hover:none){.mx{opacity:.6}}
.taskchip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;margin-top:4px;max-width:100%;text-align:left;color:var(--fg)}
.taskchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.taskchip b{white-space:nowrap}
.taskchip:hover{border-color:var(--accent)}
.chat-comp{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.comp-row{display:flex;gap:8px;align-items:flex-end}

.comp-task{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

@media (max-width:760px){.chat{grid-template-columns:minmax(0,1fr);height:calc(100vh - 200px)}.chat.thread .chat-list{display:none}.chat:not(.thread) .chat-main{display:none}.chat-back{display:inline-block}}
.planbar{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:8px 10px;background:var(--surface-2)}
.planbar.none{border-left-color:var(--line)}
.planbar .pi{color:var(--accent);display:inline-flex}
.planbar .pt{min-width:0;flex:1;display:flex;flex-direction:column;font-size:13px;line-height:1.35}
.planbar .pt b{font-weight:600}
.planbar .pt span{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan-side{background:var(--surface);width:min(540px,calc(100vw - 600px));height:100%;overflow-y:auto;box-shadow:var(--shadow);border-right:1px solid var(--line);display:flex;flex-direction:column}
@media (max-width:1120px){.plan-side{position:fixed;right:0;top:0;bottom:0;width:min(560px,100%);z-index:3}}
@media (prefers-reduced-motion:no-preference){.plan-side{animation:slide .18s ease-out}}
.plan-h{position:sticky;top:0;background:var(--surface);padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;z-index:1}

.plan-b ol{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:9px}
.plan-b ol li::marker{font-family:var(--f-mono);color:var(--accent);font-weight:600}
.plan-b h4{font:600 15px/1.25 var(--f-display);margin:8px 0 0;padding-top:14px;border-top:1px solid var(--line);letter-spacing:.01em}

<script>
(function(){
"use strict";
const S={plans:[],plansLoaded:false,standards:[],clients:[],tasks:[],team:[],teamLoaded:false,ctasks:[],ctLoaded:false,cf:{client:"",status:"active",cat:"",party:"",q:""},clientsSub:"list",tf:{scope:"mine",status:"active",client:"",q:""},activity:[],actLoaded:false,af:{range:"30",who:"",kind:"",client:"",q:"",n:200},people:{},loaded:{standards:false,clients:false,tasks:false},view:"dash",
  f:{q:"",client:"",std:"",status:"open",fn:""}, sf:{q:"",fam:"",fn:""}, openStd:null, offline:false, readOnly:false};
let db=null, mcp=null, downloads=null, userNS=null, meId=null;
/* Sandbox copy: Outlook calendar writes are off so testing here can't create real calendar entries. Set to false to re-enable. */
const SANDBOX=true;
const REM_OPTS=[90,60,30,14,7,1];
const NERC_BASE="https://www.nerc.com/pa/Stand/Reliability%20Standards/";
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{if(!s)return null;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const daysUntil=s=>{const d=parse(s);return d?Math.round((d-today())/86400000):null};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const addMonths=(s,n)=>{const d=parse(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ymd(d)};
const fmt=s=>{const d=parse(s);return d?d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}):"—"};
const isLink=v=>/^https:\/\/\S+$/i.test(String(v||"").trim());
const stdDefaultLink=s=>NERC_BASE+encodeURIComponent(s.code+"-"+s.version)+".pdf";
const stdLink=s=>(s.url&&/^https:\/\//i.test(s.url))?s.url:stdDefaultLink(s);
const stdLabel=s=>s.code+"-"+s.version;
const stdByCode=c=>S.standards.find(s=>s.code===c);
const clientById=id=>S.clients.find(c=>c.id===id);
const byName=a=>[...a].sort((x,y)=>String(x.name||"").localeCompare(String(y.name||""),undefined,{sensitivity:"base",numeric:true}));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);

/* ---------- activity log ----------
   One document per day (activity/YYYY-MM-DD) holding an `entries` map, so concurrent
   writers merge instead of overwriting and the store stays far below its document cap.
   Entries store the actor's id only; names are resolved per viewer when rendering. */
let actQ=Promise.resolve();
function logAct(e){
  if(!db||S.readOnly)return;
  const now=new Date(); const day=ymd(now); const eid=now.getTime().toString(36)+uid().slice(0,6);
  const entry=Object.assign({ts:now.toISOString(),day,by:meId||null,action:"updated",kind:"task",target:"",label:"",client:"",changes:[],note:""},e);
  const raw={}; for(const c of entry.changes||[]) if(c.k) raw[c.k]={from:c.rf===undefined?null:c.rf,to:c.rt===undefined?null:c.rt};
  if(Object.keys(raw).length&&JSON.stringify(raw).length<60000)entry.raw=raw;
  entry.changes=(entry.changes||[]).slice(0,40).map(c=>({f:String(c.f),from:String(c.from??"").slice(0,300),to:String(c.to??"").slice(0,300)}));
  const snap=entry.snap; delete entry.snap; if(snap)entry.hasSnap=true;
  actQ=actQ.then(async()=>{
    if(snap){try{await db.doc("activitySnapshots/"+eid).set({day,snap:JSON.parse(JSON.stringify(snap))})}catch(_){entry.hasSnap=false}}
    const ref=db.doc("activity/"+day);
    try{await ref.update({entries:{[eid]:entry}})}
    catch(err){ if(err&&(err.code==="invalid_argument"||err.code==="not_found")){
        const snap=await ref.get().catch(()=>null);
        if(snap&&snap.exists)await ref.update({entries:{[eid]:entry}}); else await ref.set({day,entries:{[eid]:entry}});
      } else throw err }
  }).catch(()=>{});
  return actQ;
}
const showVal=(f,v)=>{if(v===null||v===undefined||v==="")return "";if(f==="links")return (v||[]).map(l=>(l.label?l.label+" ("+l.url+")":l.url)).join("; ");if(Array.isArray(v)&&f!=="collaborators")return v.join(", ");
  if(typeof v==="boolean")return v?"Yes":"No";
  if(f==="recur")return recurText(v); if(f==="remindDays")return (v||[]).join(", ")+" days";
  if(f==="clientId"){const c=clientById(v);return c?c.name:v}
  if(f==="status")return {open:"Open",inprogress:"In progress",done:"Complete",notstarted:"Not started",onhold:"On hold",review:"Pending review"}[v]||v;
  if(f==="owner")return whoName(v);
  if(f==="party")return lbl(CT_PARTY,v); if(f==="priority")return lbl(CT_PRI,v);
  if(f==="collaborators")return (v||[]).map(whoName).join(", ");
  if(typeof v==="object")return Object.entries(v).filter(([,x])=>x!==""&&x!==null).map(([k,x])=>k.toUpperCase()+": "+x).join("; ");
  if(/^\d{4}-\d{2}-\d{2}$/.test(v))return fmt(v);
  return String(v)};
const TASK_F={title:"Task",clientId:"Client",facility:"Facility",standard:"Standard",requirement:"Requirement",dueDate:"Due date",assignee:"Assignee",remindDays:"Reminders",recur:"Repeats",status:"Status",evidence:"Evidence location",notes:"Notes",completedAt:"Performed / completed",reviewedAt:"Approved"};
const CLIENT_F={name:"Entity name",ncr:"NCR ID",region:"Regional Entity",regDate:"Registration date",functions:"Registered functions",entities:"Mapped entities",facilities:"Facilities",contact:"Compliance contact",contactEmail:"Contact email",digest:"Contact digest",pmName:"Project Manager",pmEmail:"PM email",pmDigest:"PM digest",plantMgrName:"Plant Manager",plantMgrEmail:"Plant Manager email",plantMgrDigest:"Plant Manager digest",workspace:"Client Tasks add-on",sharepoint:"SharePoint folder",notes:"Notes"};
const TEAM_F={title:"Task",description:"Description",clientId:"Client",owner:"Assigned to",collaborators:"Collaborators",plannedDate:"Anticipated completion",actualDate:"Actual completion",estHours:"Estimated hours",status:"Status",links:"Links"};
const STD_F={version:"Version",title:"Title",family:"Family",applies:"Applies to",url:"Link",notes:"Notes"};
function diffs(oldO,newO,map){const out=[];for(const [k,lbl] of Object.entries(map)){if(!(k in newO))continue;
  let a=oldO?oldO[k]:undefined,b=newO[k];
  if(oldO&&(k==="digest"||k==="pmDigest")&&a===undefined)a=true;
  if(oldO&&k==="workspace"&&a===undefined)a=false;
  if(k==="entities"&&a&&b){b=Object.assign({},a,b)}
  const sa=showVal(k,a),sb=showVal(k,b); if(sa!==sb)out.push({f:lbl,from:sa,to:sb,k,rf:a===undefined?null:a,rt:b===undefined?null:b})}return out}
const taskLabel=t=>(t.standard?t.standard+(t.requirement?" "+t.requirement:"")+" · ":"")+(t.title||"");

function state(t){
  if(t.status==="done")return "done";
  if(t.status==="review")return "review";
  const n=daysUntil(t.dueDate); if(n===null)return "nodate";
  if(n<0)return "overdue";
  const maxR=Math.max(0,...(t.remindDays||[]));
  if(n<=maxR)return "window";
  return t.status==="inprogress"?"inprogress":"scheduled";
}
const STATE_LABEL={review:"Pending review",nodate:"Needs due date",overdue:"Overdue",window:"Reminder active",scheduled:"Scheduled",inprogress:"In progress",done:"Complete"};
function whenText(t){
  if(t.status==="done")return "Completed "+fmt(t.completedAt);
  if(t.status==="review"){const d=sinceDays(t.completedAt);return "Performed "+fmt(t.completedAt)+(hasReport(t)?" · awaiting approval":(d!==null&&d>=0?" · report pending "+d+" day"+(d===1?"":"s"):" · report pending"))}
  const n=daysUntil(t.dueDate); if(n===null)return "No due date";
  if(n<0)return Math.abs(n)+" day"+(Math.abs(n)===1?"":"s")+" overdue";
  if(n===0)return "Due today"; return "Due in "+n+" day"+(n===1?"":"s");
}
/* Pending review: the site marks the work performed (counts for compliance and schedules the next occurrence); a CGM project manager approves and closes it once the report is posted. */
const isPerf=s=>s==="review"||s==="done";
const hasReport=t=>isLink(t.evidence);
const sinceDays=s=>{const n=daysUntil(s);return n===null?null:-n};
const DOC_ICON='<svg width="11" height="13" viewBox="0 0 11 13" aria-hidden="true" style="flex:none"><path d="M1 1h5.5L10 4.5V12H1z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6.5 1v3.5H10M3 7h5M3 9.5h5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>';
function pillHTML(t,txt){const st=state(t);const miss=st==="review"&&!hasReport(t);return '<span class="pill '+(miss?'reportdue':st)+'"'+(miss?' title="Performed, but the report or evidence link is not posted yet"':'')+'>'+(miss?DOC_ICON:'')+esc(txt)+'</span>'}
function nextReminder(t){
  if(t.status==="done"||!t.dueDate)return null;
  const offs=[...(t.remindDays||[])].sort((a,b)=>b-a);
  for(const o of offs){const d=addDays(t.dueDate,-o); if(daysUntil(d)>=0)return {date:d,off:o};}
  return null;
}
const activeTasks=()=>S.tasks.filter(t=>t.status!=="done");
const reminderTasks=()=>activeTasks().filter(t=>["overdue","window"].includes(state(t))).sort((a,b)=>(a.dueDate||"").localeCompare(b.dueDate||""));

function confirm1(btn,msg){if(btn&&btn.dataset.armed==="1"){delete btn.dataset.armed;return true}if(btn)btn.dataset.armed="1";toast(msg+" Click again to confirm.");return false}
function toast(msg){const r=$("#toastRoot");r.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(toast._t);toast._t=setTimeout(()=>r.innerHTML="",3800)}

/* ---------- rendering ---------- */
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.v===S.view)));
  const n=reminderTasks().length; const bn=$("#bellN"); bn.textContent=n; bn.classList.toggle("zero",n===0);
  $("#newTaskTop").hidden=S.readOnly;
  const m=$("#main");
  let pre=SANDBOX?'<div class="banner warn"><b>Sandbox copy.</b> This page has its own data store, separate from the live tracker. Edits, deletes and the activity log here stay here. Outlook reminders are turned off. The Reporting Forms and Audit Worksheets buttons still open the live shared portals.</div>':"";
  if(S.offline) pre+='<div class="banner warn">This view can\'t reach the tracker\'s shared store, so nothing can be loaded or saved here. Open the tracker from claude.ai while signed in.</div>';
  else if(S.readOnly) pre+='<div class="banner">You have view-only access. Ask the tracker owner for Contributor access to add or update tasks.</div>';
  if(CH.el&&CH.el.isConnected){const th=CH.el.querySelector("#chThread");CH.keepScroll=th?th.scrollTop:null;CH.el.remove()}
  paintBadge(); $("#msgBtn").setAttribute("aria-pressed",String(S.view==="chat"));
  const v={dash:viewDash,tasks:viewTasks,team:viewTeam,chat:viewChat,standards:viewStandards,clients:viewClients,forms:viewForms,rsaw:viewRsaw,activity:viewActivity}[S.view]();
  m.innerHTML=pre+v;
  bindView();
  const mt=$("#chatMount"); if(mt)mountChat(mt);
}

function itemHTML(t){
  const st=state(t), c=clientById(t.clientId), s=stdByCode(t.standard);
  return '<div class="item '+st+'" data-task="'+esc(t.id)+'" tabindex="0" role="button">'+
    '<span class="bar"></span><div style="min-width:0"><div class="t">'+esc(t.title)+(t.sample?' <span class="chip">SAMPLE</span>':'')+'</div>'+
    '<div class="m">'+(s?'<span class="mono">'+esc(stdLabel(s))+(t.requirement?' '+esc(t.requirement):'')+'</span>':(t.standard?'<span class="mono">'+esc(t.standard)+'</span>':''))+
    (c?'<span>'+esc(c.name)+'</span>':'')+(t.facility?'<span>'+esc(t.facility)+'</span>':'')+(t.assignee?'<span>'+esc(t.assignee)+'</span>':'')+'</div></div>'+
    '<div class="when"><b>'+esc(fmt(t.dueDate))+'</b>'+pillHTML(t,whenText(t))+'</div></div>';
}

function viewDash(){
  if(!allLoaded()) return loadingPanel();
  const act=activeTasks(); const od=act.filter(t=>state(t)==="overdue"); const d30=act.filter(t=>{const n=daysUntil(t.dueDate);return t.status!=="review"&&n!==null&&n>=0&&n<=30});
  const rv=act.filter(t=>t.status==="review").sort((a,b)=>(a.completedAt||"").localeCompare(b.completedAt||"")); const rvMiss=rv.filter(t=>!hasReport(t));
  const q0=new Date();const qStart=ymd(new Date(q0.getFullYear(),Math.floor(q0.getMonth()/3)*3,1));
  const doneQ=S.tasks.filter(t=>t.status==="done"&&(t.completedAt||"")>=qStart);
  const rem=reminderTasks();
  const upcoming=act.filter(t=>!["overdue","window","review"].includes(state(t))&&t.dueDate).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,40);
  let up=""; let lastM="";
  for(const t of upcoming){const mo=parse(t.dueDate).toLocaleDateString(undefined,{month:"long",year:"numeric"}); if(mo!==lastM){up+='<div class="month">'+esc(mo)+'</div>';lastM=mo} up+=itemHTML(t)}
  const noClients=S.clients.length===0;
  const perClient=S.clients.map(c=>{const ts=act.filter(t=>t.clientId===c.id);return {c,open:ts.length,od:ts.filter(t=>state(t)==="overdue").length,win:ts.filter(t=>state(t)==="window").length}}).sort((a,b)=>b.od-a.od||b.win-a.win);
  return '<div class="strip">'+
    '<button class="stat crit" data-jump="overdue"><span class="eyebrow">Overdue</span><span class="v">'+od.length+'</span><span class="muted">past due date</span></button>'+
    '<button class="stat warn" data-jump="d30"><span class="eyebrow">Due ≤ 30 days</span><span class="v">'+d30.length+'</span><span class="muted">coming due</span></button>'+
    '<button class="stat" data-jump="review"><span class="eyebrow">Pending review</span><span class="v" style="color:var(--accent)">'+rv.length+'</span><span class="muted">'+(rvMiss.length?rvMiss.length+' awaiting report':'performed, awaiting approval')+'</span></button>'+
    '<button class="stat" data-jump="open"><span class="eyebrow">Open tasks</span><span class="v">'+act.length+'</span><span class="muted">across '+S.clients.length+' client'+(S.clients.length===1?'':'s')+'</span></button>'+
    '<button class="stat ok" data-jump="done"><span class="eyebrow">Closed this quarter</span><span class="v">'+doneQ.length+'</span><span class="muted">since '+esc(fmt(qStart))+'</span></button></div>'+
  (act.filter(t=>!t.dueDate).length?'<button class="banner warn" data-jump="nodate" style="text-align:left;cursor:pointer;width:100%"><b>'+act.filter(t=>!t.dueDate).length+' task'+(act.filter(t=>!t.dueDate).length===1?' needs':'s need')+' a due date.</b> Reminders and digest emails skip tasks without one. Open the list to set them.</button>':'')+
  (noClients?'<div class="panel"><div class="empty"><b>Start by adding a client</b><span>Add a Generator Owner / Operator entity, then create tasks from the standards library.</span>'+(S.readOnly?'':'<button class="btn primary" data-act="newClient">Add client</button>')+'</div></div>':'')+
  '<div class="cols"><div class="panel"><div class="panel-h"><h3>Reminders</h3><span class="muted">Overdue, or inside a reminder window</span></div><div class="list">'+
    (rem.length?rem.map(itemHTML).join(""):'<div class="empty"><b>No active reminders</b><span>Tasks appear here once they enter the reminder window you set (for example 30 or 7 days before due).</span></div>')+
  '</div></div>'+
  '<div class="panel"><div class="panel-h"><h3>By client</h3></div>'+
    (perClient.length?'<div class="tbl-wrap"><table style="min-width:0"><thead><tr><th>Client</th><th>Open</th><th>Reminders</th><th>Overdue</th></tr></thead><tbody>'+
    perClient.map(p=>'<tr data-clientjump="'+esc(p.c.id)+'"><td>'+esc(p.c.name)+'</td><td class="num">'+p.open+'</td><td class="num">'+p.win+'</td><td class="num" style="color:'+(p.od?'var(--crit)':'inherit')+'">'+p.od+'</td></tr>').join("")+'</tbody></table></div>':'<div class="empty">No clients yet.</div>')+
  '</div></div>'+
  (rv.length?'<div class="panel"><div class="panel-h"><h3>Pending review</h3><span class="muted">Performed on site, waiting for the report and project manager approval</span></div><div class="list">'+rv.map(itemHTML).join("")+'</div></div>':'')+
  '<div class="panel"><div class="panel-h"><h3>Upcoming schedule</h3><span class="muted">Next 40 tasks outside their reminder window</span></div><div class="list">'+
    (up||'<div class="empty">Nothing scheduled beyond the current reminder windows.</div>')+'</div></div>';
}

function filteredTasks(){
  const f=S.f; const q=f.q.trim().toLowerCase();
  return S.tasks.filter(t=>{
    const st=state(t);
    if(f.status==="open"&&t.status==="done")return false;
    if(f.status==="overdue"&&st!=="overdue")return false;
    if(f.status==="d30"){const n=daysUntil(t.dueDate);if(isPerf(t.status)||n===null||n<0||n>30)return false}
    if(f.status==="window"&&!["overdue","window"].includes(st))return false;
    if(f.status==="done"&&t.status!=="done")return false;
    if(f.status==="nodate"&&(t.status==="done"||t.dueDate))return false;
    if(f.status==="review"&&t.status!=="review")return false;
    if(f.status==="noreport"&&!(t.status==="review"&&!hasReport(t)))return false;
    if(f.client&&t.clientId!==f.client)return false;
    if(f.std&&t.standard!==f.std)return false;
    if(f.fn){const s=stdByCode(t.standard);if(!s||!(s.applies||[]).includes(f.fn))return false}
    if(q){const c=clientById(t.clientId);const hay=[t.title,t.standard,t.requirement,t.facility,t.assignee,t.notes,c&&c.name].join(" ").toLowerCase();if(!hay.includes(q))return false}
    return true;
  }).sort((a,b)=>f.status==="done"?(b.completedAt||"").localeCompare(a.completedAt||""):(a.dueDate||"9").localeCompare(b.dueDate||"9"));
}
function viewTasks(){
  if(!allLoaded()) return loadingPanel();
  const rows=filteredTasks();
  const stds=[...S.standards].sort((a,b)=>a.code.localeCompare(b.code));
  return '<div class="panel"><div class="panel-h"><h2>Tasks</h2><span class="muted mono">'+rows.length+' shown</span><span class="sp toolbar">'+
    (downloads?'<button class="btn sm" data-act="csv">Export CSV</button>':'')+(S.readOnly?'':'<button class="btn sm primary" data-act="newTask">New task</button>')+'</span></div>'+
    '<div class="toolbar" style="padding:12px 16px;border-bottom:1px solid var(--line)">'+

const plain=o=>{const x=JSON.parse(JSON.stringify(o||{}));delete x.id;return x};
const actColl={task:"tasks",client:"clients",standard:"standards",team:"teamTasks",ctask:"clientTasks"};
const recArr=k=>({task:S.tasks,client:S.clients,standard:S.standards,team:S.team,ctask:S.ctasks})[k];
const recordExists=(kind,id)=>{const arr=recArr(kind);return !!(arr&&arr.some(r=>r.id===id))};
function restoreInfo(e){
  if(S.readOnly||!actColl[e.kind]||!e.target||e.restoredAt)return null;
  if(e.action==="deleted"&&e.hasSnap)return recordExists(e.kind,e.target)?null:{mode:"restore",label:"Restore"};
  if(["updated","completed","performed","approved"].includes(e.action)&&e.raw&&recordExists(e.kind,e.target)){
    const cur=recArr(e.kind).find(r=>r.id===e.target);
    const changed=Object.entries(e.raw).filter(([k,v])=>JSON.stringify(cur[k]??null)!==JSON.stringify(v.to??null)).map(([k])=>k);
    return {mode:"revert",label:"Revert",changed};
  }
  return null;
}
async function doRestore(e,btn){
  const info=restoreInfo(e); if(!info)return;
  if(btn.dataset.armed!=="1"){btn.dataset.armed="1";btn.classList.add("danger");
    btn.textContent=info.mode==="restore"?"Confirm restore":(info.changed.length?"Revert anyway? Edited since":"Confirm revert");return}
  btn.disabled=true; const col=actColl[e.kind];
  try{
    if(info.mode==="revert"){
      const cur=recArr(e.kind).find(r=>r.id===e.target);
      const body={}; for(const [k,v] of Object.entries(e.raw))body[k]=v.from??(Array.isArray(v.to)?[]:(v.to&&typeof v.to==="object"?null:""));
      await db.doc(col+"/"+e.target).update(body);
      const map={task:TASK_F,client:CLIENT_F,standard:STD_F,team:TEAM_F,ctask:CT_F}[e.kind];
      await logAct({action:"restored",kind:e.kind,target:e.target,label:e.label,client:e.client,note:"Reverted the change made "+new Date(e.ts).toLocaleString(),changes:diffs(cur,body,map)});
      toast("Change reverted.");
    } else {
      const snapDoc=await db.doc("activitySnapshots/"+e.id).get();
      if(!snapDoc.exists){toast("The saved copy of this record wasn't found, so it can't be restored.");btn.disabled=false;return}
      const sn=snapDoc.data().snap; let nTasks=0;
      if(e.kind==="standard"&&S.standards.some(x=>x.code===sn.data.code)){toast(sn.data.code+" is already back in the library.");btn.disabled=false;return}
      await db.doc(col+"/"+e.target).set(plain(sn.data));
      for(const t of sn.tasks||[]){ if(!S.tasks.some(x=>x.id===t.id)){await db.doc("tasks/"+t.id).set(plain(t));nTasks++} }
      for(const t of sn.ctasks||[]){ if(!S.ctasks.some(x=>x.id===t.id)){await db.doc("clientTasks/"+t.id).set(plain(t));nTasks++} }
      await logAct({action:"restored",kind:e.kind,target:e.target,label:e.label,client:e.client,note:"Restored from the deletion on "+new Date(e.ts).toLocaleString()+(nTasks?" with "+nTasks+" task"+(nTasks===1?"":"s"):"")});
      toast((ACT_KIND[e.kind]||"Record")+" restored"+(nTasks?" with "+nTasks+" task"+(nTasks===1?"":"s"):"")+".");
    }
    const ref=db.doc("activity/"+(e.day||ymd(new Date(e.ts))));
    try{await ref.update({entries:{[e.id]:{restoredAt:new Date().toISOString(),restoredBy:meId||null}}})}catch(_){}
  }catch(err){btn.disabled=false;writeErr(err)}
}

const lbl=(arr,v,d)=>(arr.find(x=>x[0]===v)||[,d||v||""])[1];

/* ---------- task plans: step-by-step instructions shown beside a NERC task, out of the way until opened ----------
   taskPlans/{id}: {title, standard, body, matches:[ "standard|task title" lowercased ]}. A task uses its own planId
   if set, otherwise the plan whose matches include its standard and title, so new tasks with the same name pick it up.
   Body format: one step per line; "## " section, "### " subsection, "- " reference bullet. */
const planKey=t=>((t.standard||"")+"|"+(t.title||"")).toLowerCase();
function planFor(t){ if(!t)return null; if(t.planId==="none")return null; if(t.planId){const p=S.plans.find(x=>x.id===t.planId);if(p)return p}
  const k=planKey(t); return S.plans.find(p=>(p.matches||[]).includes(k))||null }
const planSteps=b=>String(b||"").split("\n").map(s=>s.trim()).filter(Boolean);
const planCount=b=>{let n=0;for(const l of planSteps(b)){if(l.startsWith("#"))break;n++}return n};
function planBarHTML(t){
  if(!S.plansLoaded)return '<div class="planbar none"><div class="pt"><b>Task plan</b><span>Loading…</span></div></div>';
  const p=planFor(t);
  if(p){const n=planCount(p.body), ref=/^#/m.test(p.body);
    return '<div class="planbar"><span class="pi">'+DOC_ICON+'</span><div class="pt"><b>Task plan</b><span>'+esc(p.title)+' · '+n+' step'+(n===1?'':'s')+(ref?' + reference':'')+'</span></div><button type="button" class="btn sm" id="planBtn" aria-controls="planSide">View plan</button></div>'}
  return '<div class="planbar none"><div class="pt"><b>Task plan</b><span>No plan linked to this task yet.</span></div>'+(S.readOnly?'':'<button type="button" class="btn sm" id="planBtn">Add a plan</button>')+'</div>';
}
function planBodyHTML(body){
  let h="",ol=false,ul=false; const cl=()=>{if(ol){h+="</ol>";ol=false}if(ul){h+="</ul>";ul=false}};
  for(const l of planSteps(body)){
    if(l.startsWith("### ")){cl();h+="<h5>"+linkify(l.slice(4))+"</h5>"}
    else if(l.startsWith("## ")){cl();h+="<h4>"+linkify(l.slice(3))+"</h4>"}
    else if(l.startsWith("- ")){if(ol){h+="</ol>";ol=false}if(!ul){h+="<ul>";ul=true}h+="<li>"+linkify(l.slice(2))+"</li>"}
    else{if(ul){h+="</ul>";ul=false}if(!ol){h+="<ol>";ol=true}h+="<li>"+linkify(l)+"</li>"}}
  cl(); return h||'<p class="muted">This plan has no steps yet.</p>';
}
function planText(p){let n=0;return p.title+"\n\n"+planSteps(p.body).map(l=>l.startsWith("### ")?"\n"+l.slice(4):l.startsWith("## ")?"\n"+l.slice(3).toUpperCase():l.startsWith("- ")?"  • "+l.slice(2):(++n)+". "+l).join("\n")}

async function planAction(t,act,btn){

        logAct({action:"created",kind:"plan",target:id,label:title,client:all?"":t.clientId,note:all?"New task plan for every “"+t.title+"” task":"New task plan for one task"});toast("Plan added.")}
      setTimeout(()=>{const tt=S.tasks.find(x=>x.id===t.id)||t;refreshPlanBar(tt);paintPlan(tt,"view")},350); return}
    if(act==="savepick"){
      const sel=document.querySelector('input[name=pl_pick]:checked'); if(!sel){toast("Choose a plan.");return} const pid=sel.value; const scope=document.querySelector('input[name=pl_scope]:checked').value;

  }catch(e){btn.disabled=false;writeErr(e)}

    if(v.estHours!==""&&isNaN(v.estHours)){toast("Enter estimated hours as a number.");$("#tm_hrs").focus();return}
    const badLink=v.links.find(l=>!/^https:\/\/\S+$/i.test(l.url)); if(badLink){toast("Links must be full web addresses starting with https://");return}

      close();

  $("#tmForm").addEventListener("submit",e=>{e.preventDefault();save(read())});
  const dn=$("#tm_done"); if(dn)dn.onclick=()=>{const v=read();v.status="done";if(!v.actualDate)v.actualDate=ymd(today());save(v)};

    $("#delNo").onclick=()=>$("#delZone").innerHTML="";

}

function actRows(){
  const f=S.af; const q=f.q.trim().toLowerCase();
  const since=f.range==="all"?"":new Date(Date.now()-(+f.range)*86400000).toISOString();
  return S.activity.filter(e=>(!since||e.ts>=since)&&(!f.who||(e.by||"")===f.who)&&(!f.kind||e.kind===f.kind)&&(!f.client||e.client===f.client)&&
    (!q||[e.label,e.note,e.action,e.kind,...(e.changes||[]).map(c=>c.f+" "+c.from+" "+c.to)].join(" ").toLowerCase().includes(q)));
}

function writeErr(e){
  const c=e&&e.code;
  if(c==="invalid_argument"&&!S.readOnly){S.readOnly=true;render();toast("Your access is view-only, so changes can't be saved.");return}
  if(c==="quota_exceeded"){toast("The tracker's storage is full. Remove completed or sample records, then try again.");return}

  toast("Couldn't save: "+((e&&e.message)||"unknown error"));
}

async function saveExisting(t,v){
  const wasDone=isPerf(t.status), nowDone=isPerf(v.status);
  const doneDate=v.doneDate; delete v.doneDate; const nextDue=v.nextDue; delete v.nextDue; const moveNext=v.moveNext; delete v.moveNext;
  const body=Object.assign({},v,{completedAt:nowDone?(doneDate||(wasDone?t.completedAt:ymd(today()))):null});
  if(v.status==="review"&&t.status!=="review")Object.assign(body,{performedBy:meId||null,reviewedAt:null,reviewedBy:null});
  else if(v.status==="done"&&t.status!=="done")Object.assign(body,{reviewedAt:ymd(today()),reviewedBy:meId||null});
  else if(!nowDone)Object.assign(body,{reviewedAt:null,reviewedBy:null});
  await db.doc("tasks/"+t.id).update(body);
  const ch=diffs(t,body,TASK_F);
  if(ch.length)logAct({action:(v.status==="review"&&t.status!=="review"?"performed":v.status==="done"&&t.status!=="done"?(t.status==="review"?"approved":"completed"):"updated"),kind:"task",target:t.id,label:taskLabel(Object.assign({},t,body)),client:body.clientId||t.clientId,changes:ch});
  if(moveNext&&t.nextId){const nt=S.tasks.find(x=>x.id===t.nextId);
    if(nt&&nt.status!=="done"&&nt.dueDate!==moveNext){await db.doc("tasks/"+nt.id).update({dueDate:moveNext});
      logAct({action:"updated",kind:"task",target:nt.id,label:taskLabel(nt),client:nt.clientId,note:"Rescheduled because the previous occurrence's completion date changed",changes:diffs(nt,{dueDate:moveNext},TASK_F)});
      toast("Saved. Next occurrence moved to "+fmt(moveNext)+".");return}}
  if(nowDone&&!wasDone&&v.recur&&v.recur.n>0&&v.dueDate&&!t.nextId){
    const nd=nextDue||nextDueFor(v.recur,v.dueDate,body.completedAt);
    const nid=uid();
    await db.doc("tasks/"+nid).set({title:v.title,clientId:v.clientId,facility:v.facility,standard:v.standard,requirement:v.requirement,dueDate:nd,assignee:v.assignee,remindDays:v.remindDays,recur:v.recur,status:"open",evidence:"",notes:"",createdAt:ymd(today()),completedAt:null,prevId:t.id,sample:!!t.sample});
    await db.doc("tasks/"+t.id).update({nextId:nid});
    logAct({action:"created",kind:"task",target:nid,label:taskLabel(v),client:v.clientId,note:"Next occurrence scheduled, due "+fmt(nd)+(nextDue&&nextDue!==nextDueFor(v.recur,v.dueDate,body.completedAt)?" (date set manually)":" ("+recurText(v.recur).toLowerCase()+(v.recur.basis==="done"?"":" from the previous due date")+")")});
    toast((v.status==="review"?"Marked performed and sent for review. ":"Completed. ")+"Next occurrence scheduled for "+fmt(nd)+".");
  } else toast(v.status==="review"&&t.status!=="review"?"Marked performed. It's now pending review.":v.status==="done"&&t.status==="review"?"Approved and closed.":nowDone&&!wasDone?"Task completed.":"Saved.");
}
async function bulkCreate(sid){
  const s=S.standards.find(x=>x.id===sid); const cid=$("#bulkClient-"+CSS.escape(sid)).value;
  if(!cid){toast("Choose a client first.");return}
  const tpls=(s.templates||[]).filter(t=>t.recur&&t.recur.n>0);
  if(!tpls.length){toast("This standard has only event-driven obligations; create those tasks individually.");return}
  try{for(const tp of tpls){const due=addInterval(ymd(today()),tp.recur);
    await db.doc("tasks/"+uid()).set({title:tp.title,clientId:cid,facility:"",standard:s.code,requirement:tp.req||"",dueDate:due,assignee:"",remindDays:tp.recur.unit==="d"?[7,1]:[30,7],recur:tp.recur,status:"open",evidence:"",notes:"Due date set one interval from today; adjust to the last completed date.",createdAt:ymd(today()),completedAt:null})}
   logAct({action:"created",kind:"task",target:s.code,label:s.code+" recurring tasks",client:cid,note:tpls.length+" recurring task"+(tpls.length===1?"":"s")+" created from the "+s.code+" library: "+tpls.map(t=>t.title).join("; ")});
   toast(tpls.length+" recurring task"+(tpls.length===1?"":"s")+" created for "+clientById(cid).name+". Adjust due dates to your last completion.");}catch(e){writeErr(e)}
}

/* ---------- Outlook ---------- */
async function addOutlook(t,btn){
  if(!mcp)return; btn.disabled=true; btn.textContent="Adding…";
  const tz=(Intl.DateTimeFormat().resolvedOptions().timeZone)||"America/New_York";
  const c=clientById(t.clientId), s=stdByCode(t.standard);
  const dates=[...new Set([...(t.remindDays||[]).map(o=>({d:addDays(t.dueDate,-o),o})),{d:t.dueDate,o:0}].filter(x=>daysUntil(x.d)>=0).map(x=>JSON.stringify(x)))].map(x=>JSON.parse(x));
  if(!dates.length){toast("All reminder dates for this task have passed.");btn.disabled=false;btn.textContent="Add reminders to Outlook";return}
  const body="NERC compliance task: "+t.title+"\nClient: "+(c?c.name:"—")+(t.facility?"\nFacility: "+t.facility:"")+"\nStandard: "+(s?stdLabel(s):t.standard||"—")+(t.requirement?" "+t.requirement:"")+"\nDue: "+fmt(t.dueDate)+(t.assignee?"\nAssignee: "+t.assignee:"")+(s?"\nStandard text: "+stdLink(s):"");
  let made=0;
  try{
    for(const x of dates){
      const subj=(x.o?"Reminder ("+x.o+"d): ":"DUE TODAY: ")+(s?s.code+" ":"")+t.title+(c?" — "+c.name:"");
      await mcp.callTool("Microsoft 365","outlook_create_event",{subject:subj.slice(0,255),start:{dateTime:x.d+"T08:00:00",timeZone:tz},end:{dateTime:x.d+"T08:15:00",timeZone:tz},body,bodyType:"text",showAs:"free",importance:x.o<=7?"high":"normal"});
      made++;
    }
    await db.doc("tasks/"+t.id).update({outlook:{date:ymd(today()),count:made,due:t.dueDate}});
    logAct({action:"reminders added",kind:"outlook",target:t.id,label:taskLabel(t),client:t.clientId,note:made+" Outlook calendar reminder"+(made===1?"":"s")+" for due date "+fmt(t.dueDate)});
    toast(made+" Outlook reminder"+(made===1?"":"s")+" added to your calendar.");
    closeModal();
  }catch(e){
    const code=e&&e.code; let msg;
    if(code==="needs_reauth")msg="Reconnect Microsoft 365 in claude.ai Settings → Connectors, then try again.";
    else if(code==="server_not_connected"||code==="selection_required")msg="Add the Microsoft 365 connector in claude.ai Settings → Connectors to send reminders to Outlook.";
    else if(code==="not_in_manifest")msg="Outlook access is turned off for this tracker. Allow Microsoft 365 in the tracker's permissions to use it.";
    else if(code==="blocked_by_policy"||code==="approval_required")msg="Your organization's policy blocks creating Outlook events from here.";
    else if(code==="tool_error")msg="Outlook refused the event: "+(e.message||"");
    else msg="Outlook didn't confirm. Check your calendar before trying again.";
    toast((made?made+" added before the error. ":"")+msg);
    btn.disabled=false; btn.textContent="Add reminders to Outlook";
  }
}

/* every distinct open task in the tracker, one representative per title+standard+requirement */
const taskKey=t=>[t.title,t.standard,t.requirement].map(x=>String(x||"").trim().toLowerCase()).join("|");
function taskSet(){
  const m=new Map();
  for(const t of S.tasks){ if(t.sample||t.status==="done")continue; const c=clientById(t.clientId); if(c&&c.sample)continue;
    const k=taskKey(t), cur=m.get(k);
    if(!cur||(cur.copiedFrom&&!t.copiedFrom)||(!!cur.copiedFrom===!!t.copiedFrom&&(t.dueDate||"")<(cur.dueDate||"")))m.set(k,t); }
  return m;
}
function missingTasksFor(clientId){
  const have=new Set(S.tasks.filter(t=>clientId&&t.clientId===clientId).map(taskKey));
  return [...taskSet().entries()].filter(([k])=>!have.has(k)).map(([,t])=>t);
}
async function assignTasks(clientId,contactName){
  const list=missingTasksFor(clientId); let n=0;
  for(const t of list){
    await db.doc("tasks/"+uid()).set({title:t.title,clientId,facility:"",standard:t.standard||"",requirement:t.requirement||"",dueDate:"",assignee:contactName||"",remindDays:t.remindDays||[30,7],recur:t.recur||{n:0,unit:"m"},status:"open",evidence:"",notes:"",createdAt:ymd(today()),completedAt:null,copiedFrom:t.id});
    n++;
  }
  return n;
}
async function clearSample(btn){
  if(btn.dataset.armed!=="1"){btn.dataset.armed="1";btn.textContent="Click again to remove sample data";btn.classList.add("danger");return}
  try{for(const t of S.tasks.filter(t=>t.sample))await db.doc("tasks/"+t.id).delete();for(const c of S.clients.filter(c=>c.sample))await db.doc("clients/"+c.id).delete();logAct({action:"deleted",kind:"client",target:"sample",label:"Sample data",note:"Sample client and tasks removed"});toast("Sample data removed.")}catch(e){writeErr(e)}
}

  if(!downloads)return; const rows=actRows(); const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const head=["Date","Time","User","Action","Record type","Record","Client","Field","From","To","Note"]; const out=[head.map(q).join(",")];
  for(const e of rows){const d=new Date(e.ts);const c=clientById(e.client);const base=[ymd(d),d.toLocaleTimeString(),whoName(e.by),e.action,ACT_KIND[e.kind]||e.kind,e.label,c?c.name:(e.clientName||"")];
    const ch=e.changes&&e.changes.length?e.changes:[{f:"",from:"",to:""}];
    ch.forEach((x,i)=>out.push(base.concat([x.f,x.from,x.to,i===0?e.note:""]).map(q).join(",")))}
  try{await downloads.save({filename:"nerc-tracker-activity-"+ymd(today())+".csv",data:out.join("\r\n")})}catch(e){if(e&&e.code!=="declined")toast("Couldn't export: "+(e.message||e.code))}
}

/* ---------- boot ---------- */
try{const cs=localStorage.getItem("nct_csub");if(cs==="tasks")S.clientsSub="tasks"}catch(_){}
try{const v=localStorage.getItem("nct_view");if(v&&["dash","tasks","team","chat","standards","clients","forms","rsaw","activity"].includes(v))S.view=v}catch(_){}
render();
(async function boot(){
  const C=window.claude;
  if(!C||!C.use){S.offline=true;render();return}
  db=await C.use("db");
  if(!db){S.offline=true;render();return}
  C.use("user").then(async u=>{if(!u)return;userNS=u;meId=await u.id();
    if(meId)db.doc("data/users/"+meId+"/chatReads").onSnapshot(d=>{CH.reads=(d&&d.exists&&d.data().r)||{};paintBadge();if(chatShown())paintList()},()=>{});
    if(S.view==="chat")render();const w=await u.can("data.write");if(w===false){S.readOnly=true;render()}else if(S.view==="activity"||S.view==="team")render()}).catch(()=>{});
  C.use("downloads").then(d=>{downloads=d;render()}).catch(()=>{});
  if(!SANDBOX)C.use("mcp").then(m=>{mcp=m}).catch(()=>{});
  const sub=(col,key,map)=>db.collection(col).onSnapshot(s=>{S[key]=s.docs.map(d=>Object.assign({id:d.id},d.data()));S.loaded[key]=true;render()},e=>{S.loaded[key]=true;if(e&&e.code==="revoked"){S.offline=true}render()});
  sub("standards","standards");sub("clients","clients");sub("tasks","tasks");
  db.collection("teamTasks").onSnapshot(sn=>{S.team=sn.docs.map(d=>Object.assign({id:d.id},d.data()));S.teamLoaded=true;if(S.view==="team"||S.view==="activity")render()},()=>{S.teamLoaded=true;if(S.view==="team")render()});
  db.collection("taskPlans").onSnapshot(sn=>{S.plans=sn.docs.map(d=>Object.assign({id:d.id},d.data()));S.plansLoaded=true},()=>{S.plansLoaded=true});
  db.collection("chats").onSnapshot(sn=>{CH.list=sn.docs.map(d=>Object.assign({id:d.id},d.data()));const first=!CH.loaded;CH.loaded=true;
    if(first&&S.view==="chat")render(); else {paintBadge();if(chatShown()){paintList();paintThread()}markRead()}},()=>{CH.loaded=true;if(S.view==="chat")render()});
  db.collection("clientTasks").onSnapshot(sn=>{S.ctasks=sn.docs.map(d=>Object.assign({id:d.id},d.data()));S.ctLoaded=true;if(S.view==="clients"||S.view==="activity")render()},()=>{S.ctLoaded=true;if(S.view==="clients")render()});
  db.collection("activity").orderBy("day","desc").limit(400).onSnapshot(snap=>{const all=[];for(const d of snap.docs){const x=d.data();for(const [k,e] of Object.entries(x.entries||{}))all.push(Object.assign({id:k},e))}
    all.sort((a,b)=>(b.ts||"").localeCompare(a.ts||""));S.activity=all;S.actLoaded=true;if(S.view==="activity")render()},()=>{S.actLoaded=true;if(S.view==="activity")render()});
  // re-evaluate due states once the day changes
  setInterval(()=>{const d=ymd(today());if(d!==boot._d){boot._d=d;render()}},60000); boot._d=ymd(today());
})();
})();
</script>

<script>
(function(){
"use strict";
const host=document.getElementById("watchHost");
const root=host.attachShadow({mode:"open"});
root.appendChild(document.getElementById("watchTpl").content.cloneNode(true));
/* follow the page's light/dark choice */
const syncTheme=()=>{const t=document.documentElement.getAttribute("data-theme");if(t)host.setAttribute("data-theme",t);else host.removeAttribute("data-theme")};
syncTheme(); new MutationObserver(syncTheme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
/* gate: shown at the start of every session; Next opens the tracker; the Standards Watch tab brings it back */
function showWatch(on){document.body.classList.toggle("intro",on);window.scrollTo(0,0);if(!on){try{sessionStorage.setItem("nct_intro_done","1")}catch(_){}}}
root.addEventListener("click",e=>{if(e.target.closest("[data-next]"))showWatch(false)});
const tab=document.getElementById("watchTab"); if(tab)tab.addEventListener("click",()=>showWatch(true));
/* NERC Standards Watch.
   Published content lives in this page's data store at watch/content (one document).
   Drafts proposed by the Monday task live in watch_drafts/* and are visible only to editors.
   Approving a draft applies it to watch/content; every decision is logged in watch_log/*. */
const MODE = "embedded";

const FUNCTIONS = { gen:["GO","GOP"], tx:["TO","TOP","TP","PC"] };
const TOPICS = { ibr:"Inverter-based resources", cip:"Security (CIP)", model:"Modeling, data & planning", ops:"Operations & events", load:"Large loads" };
const SECTIONS = [
  { k:"upcoming", h:"Coming into effect", note:"Approved and scheduled. Effective dates are U.S. dates and fall on the first day of a calendar quarter.", pill:"Coming into effect" },
  { k:"implementing", h:"In implementation", note:"In effect, with phased compliance dates still ahead.", pill:"Phasing in" },
  { k:"recent", h:"Recently took effect", note:"Became enforceable in the last 12 months. Make sure evidence is in place.", pill:"In effect" },
  { k:"dev", h:"In development", note:"Not yet approved by FERC. Worth tracking so the compliance date doesn't arrive as a surprise.", pill:"In development" }
];
const RECENT_DAYS = 365, NEW_APPROVAL_DAYS = 270, NEWS_DAYS = 21;

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const parse = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, m-1, d||1); };
const fmt = s => { if (!s) return ""; const p = String(s).split("-"); const m = MONTHS[+p[1]-1]; return p[2] ? `${m} ${+p[2]}, ${p[0]}` : `${m} ${p[0]}`; };
const fmtShort = s => { const p = String(s).split("-"); return p[2] ? `${MONTHS[+p[1]-1]} ${+p[2]}` : MONTHS[+p[1]-1]; };
const today = (() => { const t = new Date(); t.setHours(0,0,0,0); return t; })();
const isoToday = () => { const t = new Date(); return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"); };
const days = s => Math.round((parse(s) - today) / 864e5);
const sortDate = s => String(s||"").length === 7 ? s + "-15" : String(s||"");
function rel(s){
  const n = days(s);
  if (n === 0) return "today";
  const a = Math.abs(n);
  const txt = a < 120 ? `${a} day${a===1?"":"s"}` : a < 730 ? `${Math.round(a/30.44)} months` : `${(a/365.25).toFixed(1)} years`;
  return n > 0 ? `in ${txt}` : `${txt} ago`;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isTx = f => FUNCTIONS.tx.includes(f);
const $id = id => root.getElementById(id);

// ---- content state ----
let CONTENT = null, STATUS = "loading", ITEMS = [], DEADLINES = [], ACTIVITY = [], SOURCES = {};
function prep(c){
  CONTENT = c; SOURCES = c.sources || {};
  ITEMS = Object.entries(c.items || {}).map(([id, v]) => {
    const it = Object.assign({}, v); it.id = id; it.fn = it.fn || []; it.src = it.src || [];
    it.ms = (it.milestones || []).map(m => ({d:m.d, l:m.l}));
    it.freshNews = (it.news || []).filter(n => -days(n.d) <= NEWS_DAYS);
    if (it.status === "dev") { it.phase = "dev"; return it; }
    const future = it.ms.some(m => days(m.d) > 0);
    if (days(it.effective) > 0) it.phase = "upcoming";
    else if (future || it.phasing) it.phase = "implementing";
    else if (-days(it.effective) <= RECENT_DAYS) it.phase = "recent";
    else it.phase = "archived";
    it.newApproval = !!it.ferc && -days(sortDate(it.ferc)) <= NEW_APPROVAL_DAYS;
    return it;
  }).sort((a,b) => (a.pos ?? 999) - (b.pos ?? 999));
  DEADLINES = Object.values(c.deadlines || {}).sort((a,b) => a.d.localeCompare(b.d));
  ACTIVITY = Object.values(c.activity || {}).sort((a,b) => sortDate(b.d).localeCompare(sortDate(a.d)) || (a.pos ?? 0) - (b.pos ?? 0));
}

// ---- filters (per viewer, remembered) ----
const ALL_FN = [...FUNCTIONS.gen, ...FUNCTIONS.tx];
const state = { fns:new Set(), topics:new Set(), q:"" };
try {
  const s = JSON.parse(localStorage.getItem("nercwatch2") || "{}");
  if (Array.isArray(s.fns)) s.fns.filter(f => ALL_FN.includes(f)).forEach(f => state.fns.add(f));
  if (Array.isArray(s.topics)) s.topics.filter(t => TOPICS[t]).forEach(t => state.topics.add(t));
} catch(e){}
const save = () => { try { localStorage.setItem("nercwatch2", JSON.stringify({fns:[...state.fns], topics:[...state.topics]})); } catch(e){} };
const fnMatch = list => !state.fns.size || !list || list.some(f => state.fns.has(f));
const matches = it => it.phase !== "archived" && fnMatch(it.fn)
  && (!state.topics.size || state.topics.has(it.topic))
  && (!state.q || (it.std + " " + it.title + " " + it.what).toLowerCase().includes(state.q));

const fnGroup = $id("fnGroup");
const mkChip = (label, cls, on) => { const b = document.createElement("button"); b.className = "chip " + cls; b.textContent = label; b.type = "button"; b.onclick = on; return b; };
const allBtn = mkChip("All", "", () => { state.fns.clear(); save(); render(); }); fnGroup.appendChild(allBtn);
[FUNCTIONS.gen, FUNCTIONS.tx].forEach(list => {
  const sep = document.createElement("span"); sep.className = "sep"; sep.setAttribute("aria-hidden","true"); fnGroup.appendChild(sep);
  list.forEach(f => { const b = mkChip(f, "fnc", () => { state.fns.has(f) ? state.fns.delete(f) : state.fns.add(f); save(); render(); }); b.dataset.fn = f; fnGroup.appendChild(b); });
});
const topicGroup = $id("topicGroup");
Object.entries(TOPICS).forEach(([k,v]) => { const b = mkChip(v, "", () => { state.topics.has(k) ? state.topics.delete(k) : state.topics.add(k); save(); render(); }); b.dataset.topic = k; topicGroup.appendChild(b); });
$id("q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); render(); });

// ---- rendering ----
function srcLinks(keys){
  return (keys || []).filter(k => SOURCES[k]).map(k => { const s = SOURCES[k], n = esc(String(s.t).split(",")[0]); return s.u ? `<a href="${esc(s.u)}" target="_blank" rel="noopener">${n}</a>` : n; }).join(" · ");
}
function todoHtml(it){
  const hasGen = it.fn.some(f => !isTx(f)), hasTx = it.fn.some(isTx);
  const showGen = hasGen && (!state.fns.size || [...state.fns].some(f => !isTx(f)) || !it.todoTx);
  const showTx = it.todoTx && (!state.fns.size || [...state.fns].some(isTx));
  let out = "";
  if (showGen || !showTx) out += `<p>${it.todoTx && hasTx ? `<span class="role">GO/GOP · </span>` : ""}${esc(it.todo)}</p>`;
  if (showTx) out += `<p><span class="role">${it.fn.filter(isTx).join("/")} · </span>${esc(it.todoTx)}</p>`;
  return out;
}
function card(it, sec){
  const nextMs = it.ms.find(m => days(m.d) > 0);
  const msList = it.ms.length ? `<ul class="ms">${
      (it.phase !== "upcoming" ? [{d:it.effective,l:"Standard effective"}] : []).concat(it.ms).map(m => {
        const cls = days(m.d) <= 0 ? "done" : (m === nextMs ? "next-up" : "");
        return `<li class="${cls}"><span class="md">${fmt(m.d)}</span><span>${esc(m.l)}</span></li>`;
      }).join("")}</ul>` : "";
  const news = it.freshNews.length ? `<div class="latest">${it.freshNews.map(n => `<div><span class="ld">${fmt(n.d)}</span><span>${esc(n.t)}</span></div>`).join("")}</div>` : "";
  const fercTxt = it.ferc ? `FERC approved ${fmt(it.ferc)}${it.order_no ? " · " + esc(it.order_no) : ""}` : (it.phase === "dev" ? "Not yet approved by FERC" : "");
  return `<article class="card" id="${esc(it.id)}">
    <div class="ctop">
      <div class="cid"><div class="std">${esc(it.std)}</div><div class="ctitle">${esc(it.title)}</div></div>
      <div class="cdate">${it.phase === "dev" ? `<span class="rel">${esc(it.stage)}</span>` : `<span class="rel">${it.phase === "upcoming" ? "Effective" : "Effective since"}</span><span class="d">${fmt(it.effective)}</span><span class="rel">${rel(it.effective)}</span>`}</div>
    </div>
    <div class="tags">
      ${it.freshNews.length ? `<span class="pill news">Updated recently</span>` : ""}
      ${it.newApproval ? `<span class="pill approved">New FERC approval</span>` : ""}
      <span class="pill ${it.phase}">${sec.pill}</span>
      ${it.fn.map(f => `<span class="fn">${esc(f)}</span>`).join("")}
      <span class="topic">${esc(TOPICS[it.topic] || "")}</span>
    </div>
    ${news}
    <div class="cbody">
      <div><h3>What changes</h3><p>${esc(it.what)}</p></div>
      <div><h3>What to do</h3>${todoHtml(it)}</div>
    </div>
    ${msList}
    <div class="cfoot"><span>${fercTxt}</span><span>${srcLinks(it.src)}</span></div>
  </article>`;
}

function render(){
  allBtn.setAttribute("aria-pressed", !state.fns.size);
  fnGroup.querySelectorAll("[data-fn]").forEach(b => b.setAttribute("aria-pressed", state.fns.has(b.dataset.fn)));
  topicGroup.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", state.topics.has(b.dataset.topic)));
  $id("asof").textContent = CONTENT && CONTENT.reviewed ? `Reviewed ${fmt(CONTENT.reviewed)}` : "";

  if (STATUS !== "ready") {
    const msg = STATUS === "loading" ? "Loading the latest reviewed standards…"
      : STATUS === "offline" ? "Standards Watch content loads for signed-in members of CGM Consulting Group's organization. Open this page from claude.ai while signed in."
      : "No reviewed content has been published yet. Approved updates appear here.";
    $id("sections").innerHTML = `<div class="empty">${esc(msg)}</div>`;
    ["counts","cal","deadlines","activity","sources"].forEach(id => $id(id).innerHTML = "");
    $id("next").innerHTML = `<span class="lbl">Next compliance date</span><span class="sub">${STATUS === "loading" ? "Loading…" : "Not available yet."}</span>`;
    $id("weekBox").hidden = true;
    return;
  }

  const w = CONTENT.week;
  $id("weekBox").hidden = !(w && (w.items || []).length);
  if (w) {
    $id("weekLabel").innerHTML = `${esc(w.label)}<small>${esc(w.covers || "")}</small>`;
    $id("weekList").innerHTML = (w.items || []).map(x => `<li>${x.b ? `<b>${esc(x.b)}</b>${/^[A-Z]/.test(x.t || "") ? ": " : " "}` : ""}${esc(x.t)}</li>`).join("");
  }

  const vis = ITEMS.filter(matches);
  $id("sections").innerHTML = SECTIONS.map(sec => {
    let list = vis.filter(i => i.phase === sec.k);
    const key = i => i.phase === "implementing" ? (i.ms.find(m => days(m.d) > 0)||{d:"9999-12-31"}).d : (i.effective || "9999");
    if (sec.k !== "dev") list.sort((a,b) => sec.k === "recent" ? key(b).localeCompare(key(a)) : key(a).localeCompare(key(b)));
    else list.sort((a,b) => b.freshNews.length - a.freshNews.length);
    return `<section class="section" id="sec-${sec.k}">
      <div class="sechead"><h2>${sec.h}</h2><span class="n">${list.length}</span></div>
      <p class="secnote">${sec.note}</p>
      <div class="cards">${list.length ? list.map(i => card(i, sec)).join("") : `<div class="empty">Nothing here for the current filters.</div>`}</div>
    </section>`;
  }).join("");

  const c = k => vis.filter(i => i.phase === k).length;
  $id("counts").innerHTML = [
    ["approved", vis.filter(i => i.newApproval).length, "New FERC approvals", "sec-upcoming"],
    ["upcoming", c("upcoming"), "Coming into effect", "sec-upcoming"],
    ["implementing", c("implementing") + c("recent"), "In effect or phasing in", "sec-implementing"],
    ["dev", c("dev"), "In development", "sec-dev"]
  ].map(([k,n,l,t]) => `<a class="count" data-k="${k}" href="#${t}" data-go="${t}"><b>${n}</b><span>${l}</span></a>`).join("");

  const events = [];
  vis.filter(i => i.phase !== "dev").forEach(i => {
    events.push({d:i.effective, std:i.std, l:"effective", id:i.id});
    i.ms.forEach(m => events.push({d:m.d, std:i.std, l:m.l, id:i.id}));
  });
  events.sort((a,b) => a.d.localeCompare(b.d));
  const firstShown = new Date(today); firstShown.setFullYear(today.getFullYear() - 1);
  let html = "", yr = "", todayPlaced = false;
  events.filter(e => parse(e.d) >= firstShown).forEach(e => {
    const y = e.d.slice(0,4);
    if (!todayPlaced && days(e.d) > 0) {
      if (String(today.getFullYear()) !== yr) { html += `<div class="yr">${today.getFullYear()}</div>`; yr = String(today.getFullYear()); }
      html += `<div class="today">Today</div>`; todayPlaced = true;
    }
    if (y !== yr) { html += `<div class="yr">${y}</div>`; yr = y; }
    html += `<button type="button" data-go="${esc(e.id)}" class="${days(e.d) <= 0 ? "past" : ""}"><span class="cd">${fmtShort(e.d)}</span><span class="ct"><b>${esc(e.std)}</b> ${e.l === "effective" ? "effective" : "· " + esc(e.l)}</span></button>`;
  });
  if (events.length && !todayPlaced) html += `<div class="today">Today</div>`;
  $id("cal").innerHTML = html || `<div class="empty" style="margin:12px 16px">No dates for the current filters.</div>`;

  const dl = DEADLINES.filter(x => days(x.d) >= 0 && fnMatch(x.fn));
  $id("deadlines").innerHTML = dl.length ? dl.map(x =>
    `<li class="${days(x.d) <= 14 ? "soon" : ""}"><span class="fd">${fmt(x.d)} · ${rel(x.d)}</span><span>${esc(x.t)}</span><span class="who">${esc(x.who)}</span></li>`).join("")
    : `<li><span class="who">No open comment periods or events for the current filters.</span></li>`;
  $id("activity").innerHTML = ACTIVITY.slice(0, 14).map(a =>
    `<li><span class="fd"><span class="src">${esc(a.src)}</span>${fmt(a.d)}</span><span>${esc(a.t)}</span></li>`).join("");
  $id("sources").innerHTML = Object.values(SOURCES).map(s => `<li>${s.u ? `<a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t)}</a>` : esc(s.t)}</li>`).join("");

  const nx = events.find(e => days(e.d) > 0);
  $id("next").innerHTML = nx ? `
    <span class="lbl">Next compliance date${state.fns.size ? " · " + [...state.fns].join(", ") : ""}</span>
    <span class="big">${days(nx.d)}<span>days</span></span>
    <span class="what">${esc(nx.std)} · ${fmt(nx.d)}</span>
    <span class="sub">${nx.l === "effective" ? "Standard becomes enforceable" : esc(nx.l)}</span>
    <button type="button" data-go="${esc(nx.id)}">View details</button>` : `<span class="lbl">Next compliance date</span><span class="sub">No upcoming dates for the current filters.</span>`;
}

function go(id){
  const el = $id(id); if (!el) return;
  el.scrollIntoView({block:"start"});
  el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1600);
}
root.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) { e.preventDefault(); go(b.dataset.go); } });

function toast(msg){ const t = $id("toast"); if (!t) return; t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 4200); }

// ---- review queue (editors only, standalone page only) ----
let db = null, meId = null, isAdmin = false, DRAFTS = [], editing = null, busy = false;
const SECTION_NAME = { items:"Standard", deadlines:"Comment period / event", activity:"FERC / NERC action", sources:"Source", week:"This-week box" };
function short(v){ const s = typeof v === "string" ? v : JSON.stringify(v); return s.length > 180 ? s.slice(0,177) + "…" : s; }
function diffHtml(d){
  if (d.op === "remove") return `<p class="dnote">Removes this entry from the page.</p>`;
  const cur = d.section === "week" ? (CONTENT && CONTENT.week) : (CONTENT && CONTENT[d.section] && CONTENT[d.section][d.key]);
  const v = d.value || {};
  if (!cur) {
    if (d.section === "items") return `<p class="dnote"><b>New entry.</b> ${esc(v.std || "")} · ${esc(v.title || "")}${v.effective ? " · effective " + fmt(v.effective) : v.stage ? " · " + esc(v.stage) : ""}</p><p class="dnote">${esc(v.what || "")}</p>`;
    return `<p class="dnote"><b>New entry.</b> ${esc(short(v))}</p>`;
  }
  const keys = [...new Set([...Object.keys(cur), ...Object.keys(v)])].filter(k => k !== "pos" && JSON.stringify(cur[k]) !== JSON.stringify(v[k]));
  if (!keys.length) return `<p class="dnote">No change from what is published.</p>`;
  return `<ul class="dlist">${keys.map(k => `<li><span class="dk">${esc(k)}</span>${cur[k] !== undefined ? `<s>${esc(short(cur[k]))}</s>` : ""}<span>${v[k] !== undefined ? esc(short(v[k])) : "<i>(removed)</i>"}</span></li>`).join("")}</ul>`;
}
function renderReview(){
  const box = $id("review");
  if (!isAdmin) { box.hidden = true; return; }
  box.hidden = false;
  const list = [...DRAFTS].sort((a,b) => String(a.createdAt||"").localeCompare(String(b.createdAt||"")));
  $id("reviewCount").textContent = list.length ? `${list.length} draft${list.length===1?"":"s"} waiting` : "Nothing waiting";
  $id("approveAll").hidden = list.length < 2;
  $id("reviewList").innerHTML = list.length ? list.map(d => `
    <article class="draft" data-draft="${esc(d.id)}">
      <div class="dtop"><span class="pill dev">${esc(SECTION_NAME[d.section] || d.section)}</span><span class="pill ${d.op === "remove" ? "upcoming" : "approved"}">${d.op === "remove" ? "Remove" : (d.section !== "week" && CONTENT && CONTENT[d.section] && CONTENT[d.section][d.key]) || (d.section === "week" && CONTENT && CONTENT.week) ? "Change" : "Add"}</span><b class="dlabel">${esc(d.label || d.key)}</b><span class="dwhen">${d.createdAt ? "Drafted " + fmt(String(d.createdAt).slice(0,10)) : ""}${d.createdBy ? " · " + esc(d.createdBy) : ""}</span></div>
      ${d.reason ? `<p class="dreason">${esc(d.reason)}</p>` : ""}
      ${diffHtml(d)}
      ${(d.refs || []).length ? `<p class="drefs">${d.refs.map(r => r.u ? `<a href="${esc(r.u)}" target="_blank" rel="noopener">${esc(r.t || r.u)}</a>` : esc(r.t)).join(" · ")}</p>` : ""}
      ${editing === d.id ? `<label class="sr" for="ed-${esc(d.id)}">Edit the entry before approving</label><textarea id="ed-${esc(d.id)}" class="edjson" spellcheck="false">${esc(JSON.stringify(d.value ?? null, null, 2))}</textarea>` : ""}
      <div class="dact">
        ${editing === d.id
          ? `<button type="button" class="btn primary" data-act="approve-edit" data-id="${esc(d.id)}">Approve edited</button><button type="button" class="btn" data-act="cancel-edit">Cancel</button>`
          : `<button type="button" class="btn primary" data-act="approve" data-id="${esc(d.id)}">Approve and publish</button>${d.op !== "remove" ? `<button type="button" class="btn" data-act="edit" data-id="${esc(d.id)}">Edit first</button>` : ""}<button type="button" class="btn danger" data-act="reject" data-id="${esc(d.id)}">Reject</button>`}
      </div>
    </article>`).join("") : `<p class="dnote">The Monday task puts proposed changes here. Nothing reaches the page until you approve it.</p>`;
}
function applyDraft(c, d, value){
  const v = value !== undefined ? value : d.value;
  if (d.section === "week") { if (d.op === "remove") delete c.week; else c.week = v; return; }
  if (!["items","deadlines","activity","sources"].includes(d.section)) throw new Error("Unknown section " + d.section);
  c[d.section] = c[d.section] || {};
  if (d.op === "remove") delete c[d.section][d.key];
  else { if (d.section === "items" && v && v.pos === undefined) v.pos = c.items[d.key] ? c.items[d.key].pos : Object.keys(c.items).length; c[d.section][d.key] = v; }
}
async function decide(id, decision, edited){
  if (busy) return; const d = DRAFTS.find(x => x.id === id); if (!d || !db) return;
  busy = true;
  try {
    if (decision === "approve") {
      const snap = await db.doc("watch/content").get();
      const c = snap.exists ? JSON.parse(JSON.stringify(snap.data())) : {items:{}, deadlines:{}, activity:{}, sources:{}};
      applyDraft(c, d, edited);
      c.reviewed = isoToday(); c.updatedAt = new Date().toISOString(); c.updatedBy = meId || null;
      await db.doc("watch/content").set(c);
    }
    await db.doc("watch_log/" + id).set({ at:new Date().toISOString(), by:meId || null, decision, edited:edited !== undefined, section:d.section, op:d.op, key:d.key, label:d.label || "", reason:d.reason || "" });
    await db.doc("watch_drafts/" + id).delete();
    if (editing === id) editing = null;
    toast(decision === "approve" ? `Published: ${d.label || d.key}` : `Rejected: ${d.label || d.key}`);
  } catch (e) { toast("Couldn't save: " + ((e && (e.message || e.code)) || "unknown error")); }
  busy = false;
}
$id("review").addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === "edit") { editing = id; renderReview(); const t = $id("ed-" + id); if (t) t.focus(); return; }
  if (act === "cancel-edit") { editing = null; renderReview(); return; }
  if (act === "approve") return decide(id, "approve");
  if (act === "reject") { if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "Click again to reject"; return; } return decide(id, "reject"); }
  if (act === "approve-edit") {
    let v; try { v = JSON.parse($id("ed-" + id).value); } catch (err) { toast("That edit isn't valid JSON. Check quotes and commas, then try again."); return; }
    return decide(id, "approve", v);
  }
  if (act === "approve-all") {
    if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = `Click again to publish all ${DRAFTS.length}`; return; }
    b.disabled = true; for (const d of [...DRAFTS]) await decide(d.id, "approve"); b.disabled = false; b.dataset.armed = ""; b.textContent = "Approve all";
  }
});

// ---- boot ----
render();
(async function boot(){
  const C = window.claude;
  if (!C || !C.use) { STATUS = "offline"; render(); return; }
  db = await C.use("db");
  if (!db) { STATUS = "offline"; render(); return; }
  db.doc("watch/content").onSnapshot(s => {
    if (s.exists) { prep(s.data()); STATUS = "ready"; } else { STATUS = "empty"; }
    render(); renderReview();
  }, () => { STATUS = "offline"; render(); });
  if (MODE !== "standalone") return;
  const u = await C.use("user");
  if (!u) return;
  try { isAdmin = await u.canEdit(); meId = await u.id(); } catch (e) { isAdmin = false; }
  if (!isAdmin) return;
  renderReview();
  db.collection("watch_drafts").onSnapshot(s => { DRAFTS = s.docs.map(d => Object.assign({id:d.id}, d.data())); renderReview(); }, () => {});
})();

})();
</script>
